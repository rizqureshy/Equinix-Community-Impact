<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The promises on a white table | prototype</title>
    <meta name="description" content="Prototype for the promises section: five sheets of paper on a white table, each plan drawing itself; choose one and it comes forward and the photograph of the promise kept develops through it. The narrator reads on request." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="../brand/equinix-fortress.svg" />
    <link rel="stylesheet" href="../styles/main.css" />
    <style>
      body { background: var(--bg-soft); }
      .proto-top { padding: 40px 0 0; }
      .proto-top .brand img { display: block; height: 14px; width: auto; }
      .promises-section { padding: var(--s-6) 0 var(--s-8); }
    </style>
  </head>
  <body>
    <main id="main">
      <div class="wrap proto-top"><div class="brand"><img src="../brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" /></div></div>
      <section class="promises-section" id="promises" aria-labelledby="promises-title">
        <div class="wrap promises-head" data-reveal>
          <div>
            <p class="eyebrow">Part of the community</p>
            <h2 class="title promises-title" id="promises-title">Five promises to the places we call home.</h2>
          </div>
          <div class="promises-head-aside">
            <p class="lede">Five plans on the table. Pick one up and the promise kept develops through it.</p>
            <button type="button" class="btn btn--primary promises-play" data-promises-play aria-pressed="false"><svg class="ico-play" width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><path d="M1 1.5v9l8-4.5z" fill="currentColor"/></svg><svg class="ico-stop" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1" fill="currentColor"/></svg><span class="when-idle">Play the five promises</span><span class="when-playing">Stop</span></button>
          </div>
        </div>
        <div class="wrap"><!--@principles--></div>
      </section>
    </main>
    <script type="module" src="../scripts/prototypes/table.js"></script>
  </body>
</html>
