<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The promises, drawn | prototype</title>
    <meta name="description" content="Prototype for the promises section: each promise drawn as a plan in one red line that draws itself as you scroll; under your hand the photograph of the promise kept develops through." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="../brand/equinix-fortress.svg" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <style>
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      html, body { margin: 0; background: #fff; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
      .wrap { width: min(1280px, calc(100% - 2 * var(--gutter))); margin: 0 auto; }
      header.top { padding: 40px 0 28px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px 40px; align-items: end; }
      @media (max-width: 900px) { header.top { grid-template-columns: 1fr; } }
      .brand img { display: block; height: 14px; width: auto; }
      .eyebrow { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); font-weight: 600; margin: 16px 0 8px; }
      h1 { font-weight: 700; font-size: clamp(30px, 4.4vw, 54px); line-height: 1.02; letter-spacing: -0.03em; margin: 0; max-width: 16ch; }
      .lede { color: var(--ink-2); max-width: 54ch; margin: 0; font-size: 17px; }
      .switches { display: grid; gap: 10px; justify-items: start; }
      .switch { display: flex; gap: 6px; align-items: center; }
      .switch span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); width: 64px; }
      .switch button { font: 600 12px var(--font); color: var(--ink); background: #fff; border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
      .switch button[aria-pressed='true'] { background: var(--ink); color: #fff; border-color: var(--ink); }
      .switch button[disabled] { opacity: 0.4; cursor: default; }

      /* ---- The section: a numbered list with a growing thread, a sticky sheet beside it ---- */
      .promises { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 0 64px; padding: 24px 0 20vh; }
      .list { position: relative; padding-left: 44px; margin: 0; list-style: none; }
      .thread { position: absolute; left: 10px; top: 0; bottom: 0; width: 1px; background: var(--line); }
      .thread i { position: absolute; left: 0; top: 0; width: 1px; height: 0; background: var(--red); transition: height 0.12s linear; }
      .row { position: relative; min-height: 58vh; padding: 10vh 0; display: grid; align-content: center; gap: 10px; }
      .row::before { content: ''; position: absolute; left: -38px; top: 50%; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 1px solid var(--line-strong); transform: translateY(-50%); transition: background 0.3s, border-color 0.3s, transform 0.3s; }
      .row.on::before { background: var(--red); border-color: var(--red); transform: translateY(-50%) scale(1.25); }
      .num { font-size: 13px; letter-spacing: 0.06em; color: var(--ink-3); transition: color 0.3s; }
      .row.on .num { color: var(--red); }
      .name { font-weight: 700; font-size: clamp(24px, 2.6vw, 34px); letter-spacing: -0.025em; line-height: 1.08; margin: 0; color: var(--ink-3); transition: color 0.4s; }
      .row.on .name { color: var(--ink); }
      .promise { margin: 0; color: var(--ink-2); font-size: 17px; max-width: 42ch; opacity: 0.55; transition: opacity 0.4s; }
      .row.on .promise { opacity: 1; }
      .kept { margin: 8px 0 0; padding-top: 10px; border-top: 1px dashed var(--line-strong); font-size: 14px; color: var(--ink); max-width: 42ch; opacity: 0; transform: translateY(6px); transition: opacity 0.5s 0.25s, transform 0.5s 0.25s; }
      .row.on .kept { opacity: 1; transform: none; }
      .kept b { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--red); margin-bottom: 3px; }
      .kept a { color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; }

      .stage-col { position: relative; }
      .sheet { position: sticky; top: 7vh; height: 86vh; display: grid; place-items: center; }
      .plan { position: relative; aspect-ratio: 2 / 3; height: min(86vh, 100%); max-width: 100%; background: #fff; box-shadow: 0 1px 0 var(--line), 0 24px 70px rgb(0 0 0 / 0.07); border-radius: 6px; overflow: hidden; touch-action: manipulation; }
      /* Registration marks and a faint plan grid, as on a sheet of drawings */
      .plan::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(to right, rgb(0 0 0 / 0.035) 1px, transparent 1px), linear-gradient(to bottom, rgb(0 0 0 / 0.035) 1px, transparent 1px); background-size: 12.5% 8.333%; pointer-events: none; }
      .plan .tick { position: absolute; width: 14px; height: 14px; pointer-events: none; }
      .plan .tick::before, .plan .tick::after { content: ''; position: absolute; background: var(--ink-3); opacity: 0.6; }
      .plan .tick::before { left: 7px; top: 0; width: 1px; height: 14px; }
      .plan .tick::after { top: 7px; left: 0; height: 1px; width: 14px; }
      .plan .tick.tl { left: 14px; top: 14px; } .plan .tick.tr { right: 14px; top: 14px; } .plan .tick.bl { left: 14px; bottom: 14px; } .plan .tick.br { right: 14px; bottom: 14px; }
      .layer { position: absolute; inset: 0; }
      .drawing { display: grid; place-items: center; padding: 5%; }
      .drawing svg, .drawing img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .drawing .wash { position: absolute; inset: 5%; width: 90%; height: 90%; opacity: 0; transition: opacity 0.2s linear; }
      .drawing svg { position: relative; }
      .drawing svg path, .drawing svg line, .drawing svg polyline, .drawing svg polygon, .drawing svg circle, .drawing svg ellipse, .drawing svg rect { vector-effect: non-scaling-stroke; }
      /* The traced drawing (a raster) reveals under a soft diagonal sweep instead of stroke by stroke */
      .drawing.sweep img { -webkit-mask-image: linear-gradient(115deg, #000 calc(var(--p, 0) * 140% - 40%), transparent calc(var(--p, 0) * 140%)); mask-image: linear-gradient(115deg, #000 calc(var(--p, 0) * 140% - 40%), transparent calc(var(--p, 0) * 140%)); }
      .photo { pointer-events: none; }
      .photo canvas { width: 100%; height: 100%; display: block; }
      .pending { display: grid; place-items: center; color: var(--ink-3); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
      .pending b { display: block; font: 600 clamp(80px, 12vw, 140px)/1 var(--font); letter-spacing: -0.04em; color: var(--red); opacity: 0.12; }
      .hint { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 12px; color: var(--ink-3); pointer-events: none; transition: opacity 0.4s; }
      .plan.touched .hint { opacity: 0; }
      .sheet-note { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-size: 12px; color: var(--ink-3); }
      @media (max-width: 900px) {
        .promises { grid-template-columns: 1fr; }
        .stage-col { order: -1; }
        .sheet { position: sticky; top: 0; height: 62vh; z-index: 2; background: linear-gradient(#fff 80%, rgb(255 255 255 / 0)); }
        .plan { height: 58vh; }
        .row { min-height: 0; padding: 36px 0; }
      }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div>
          <div class="brand"><img src="../brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" /></div>
          <div class="eyebrow">Part of the community</div>
          <h1>Five promises to the places we call home.</h1>
        </div>
        <div class="switches" aria-label="Prototype treatments">
          <div class="switch" role="group" aria-label="Ink"><span>Ink</span><button type="button" data-ink="line" aria-pressed="true">Hairline</button><button type="button" data-ink="tint" aria-pressed="false">Hairline and wash</button></div>
          <div class="switch" role="group" aria-label="Drawing"><span>Drawing</span><button type="button" data-route="ref" aria-pressed="true">Traced from the photograph</button><button type="button" data-route="svg" aria-pressed="false">Sketched by the model</button></div>
          <p class="lede">Each promise is drawn as a plan: one red line, drawn as you scroll. Move your hand over the plan and the promise kept develops through it.</p>
        </div>
      </header>

      <section class="promises" aria-label="The five promises">
        <ol class="list" id="list"><div class="thread" aria-hidden="true"><i id="thread-fill"></i></div></ol>
        <div class="stage-col">
          <div class="sheet">
            <div class="plan" id="plan">
              <span class="tick tl" aria-hidden="true"></span><span class="tick tr" aria-hidden="true"></span><span class="tick bl" aria-hidden="true"></span><span class="tick br" aria-hidden="true"></span>
              <div class="layer drawing" id="drawing" aria-hidden="true"></div>
              <div class="layer photo" id="photo"><canvas id="photo-canvas"></canvas></div>
              <p class="hint" id="hint">Move your hand over the plan</p>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="../scripts/prototypes/promises.js"></script>
  </body>
</html>
