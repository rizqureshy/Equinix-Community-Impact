<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The promises, drawn | prototype</title>
    <meta name="description" content="Prototype page for the promises section: each promise drawn as a plan in one red line, then the photograph of the promise kept develops through it. The narrator reads each promise on request, or all five in turn." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="../brand/equinix-fortress.svg" />
    <link rel="stylesheet" href="../styles/main.css" />
    <style>
      /* The section is styled by sections.css, shared with the site; this is only the page around it */
      body { background: var(--bg-soft); }
      .proto-top { padding: 40px 0 0; }
      .proto-top .brand img { display: block; height: 14px; width: auto; }
      .promises-section { padding-top: var(--s-6); }
    </style>
  </head>
  <body>
    <main id="main">
      <div class="wrap proto-top"><div class="brand"><img src="../brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" /></div></div>
      <section class="promises-section" id="promises" aria-labelledby="promises-title">
        <div class="wrap center">
          <p class="eyebrow">Part of the community</p>
          <h2 class="title" id="promises-title">Five promises to the places we call home.</h2>
          <p class="lede">Each promise drawn as a plan, in one red line. Then the promise kept develops through it. Listen to one, or let the narrator read all five.</p>
          <p class="actions"><button type="button" class="btn btn--primary promises-play" data-promises-play aria-pressed="false"><svg class="ico-play" width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><path d="M1 1.5v9l8-4.5z" fill="currentColor"/></svg><svg class="ico-stop" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1" fill="currentColor"/></svg><span class="when-idle">Play the five promises</span><span class="when-playing">Stop</span></button></p>
        </div>
        <div class="wrap"><!--@principles--></div>
      </section>
    </main>
    <script type="module" src="../scripts/prototypes/promises.js"></script>
  </body>
</html>
