<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Our People | prototype</title>
    <meta name="description" content="Prototype for the People section: a group of colleagues where the one you look at comes forward with their story of impact." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="../brand/equinix-fortress.svg" />
<style>
  /* Layout: a page-wide white stage holding ten waist-up portraits in three depth rows; a story card beside whoever is in focus. */
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --fg: #1d1d1f; --muted: #6b6861; --line: #e4e1da; --accent: #e91c24;
    --display: 'Fraunces Variable', Georgia, serif; --body: 'Inter Tight Variable', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 36px max(16px, env(safe-area-inset-left, 0px)) 72px; display: grid; gap: 22px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .brand img { display: block; height: 14px; width: auto; }
  .eyebrow { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 14px 0 6px; }
  h1 { font-weight: 700; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02; letter-spacing: -0.02em; margin: 0; max-width: 16ch; }
  .lede { color: var(--muted); max-width: 58ch; margin: 0; font-size: 17px; }

  .stage { position: relative; background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.08); padding: 36px 0 0; }
  .row { display: flex; align-items: flex-end; justify-content: center; padding: 0 3%; position: relative; }
  .person { position: relative; flex: 0 0 auto; width: 21%; margin: 0 -2.6%; border: 0; padding: 0; background: none; cursor: pointer; transform-origin: 50% 85%; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
  .person img { display: block; width: 100%; height: auto; filter: drop-shadow(0 14px 26px rgba(0,0,0,.12)); -webkit-mask-image: linear-gradient(to bottom, #000 66%, rgba(0,0,0,.7) 82%, transparent 98%); mask-image: linear-gradient(to bottom, #000 66%, rgba(0,0,0,.7) 82%, transparent 98%); }
  .person.on { transform: translateY(-4%) scale(1.12); }
  .person:focus-visible { outline: none; }
  .person:focus-visible img { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 16px; }
  .marker { position: absolute; left: 0; bottom: 0; width: 56px; height: 3px; background: var(--accent); border-radius: 2px; transform: translateX(-50%); transition: left .5s cubic-bezier(.2,.7,.2,1), opacity .3s; opacity: 0; }
  .story { border-top: 1px solid var(--line); padding: 22px 32px 26px; min-height: 190px; display: grid; }
  .story .inner { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px 40px; align-items: start; transition: opacity .25s ease, transform .25s ease; }
  .story.swap .inner { opacity: 0; transform: translateY(6px); }
  .story .where { grid-column: 1 / -1; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .story .head { font-family: var(--display); font-weight: 500; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.08; letter-spacing: -0.01em; }
  .story .fig { font-family: var(--display); font-weight: 300; font-size: 48px; line-height: 1; letter-spacing: -0.02em; margin-top: 8px; }
  .story .fig small { display: block; font-family: var(--body); font-size: 13px; color: var(--muted); margin-top: 4px; letter-spacing: 0; }
  .story .line { grid-column: 2; grid-row: 2 / span 2; font-size: 15px; color: var(--fg); line-height: 1.55; }
  .story .src { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 13px; }
  .roles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; margin-top: 8px; }
  .roles button { text-align: left; border: 0; background: none; padding: 12px 0 0; border-top: 1px solid var(--line); cursor: pointer; font: inherit; color: var(--fg); display: grid; gap: 2px; min-width: 0; }
  .roles button b { font-weight: 600; font-size: 14px; }
  .roles button span { font-size: 12.5px; color: var(--muted); }
  .roles button[aria-pressed="true"] b { color: var(--accent); }

  @media (max-width: 760px) {
    .stage { border-radius: 18px; padding-top: 18px; }
    .row { justify-content: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 0 20vw; }
    .row::-webkit-scrollbar { display: none; }
    .person { flex: 0 0 58vw; width: auto; margin: 0 -7vw; scroll-snap-align: center; }
    .person.on { transform: translateY(-3%) scale(1.06); }
    .story { padding: 16px 18px 20px; }
    .story .inner { grid-template-columns: 1fr; gap: 6px; }
    .story .line { grid-column: 1; grid-row: auto; font-size: 14px; }
    .story .fig { font-size: 36px; }
    .roles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) { .person, .story, .story .inner { transition: none; } }
</style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <div class="brand"><img src="../brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" /></div>
          <div class="eyebrow">The people behind the connections</div>
          <h1>Our people are part of the story.</h1>
        </div>
        <p class="lede">Six colleagues, one line. Move across them and the one you look at comes to the front with the story of what their work does for the community. Click to keep them there.</p>
      </header>

      <div class="stage" id="stage" aria-label="Six colleagues in a line. Move across them, or use Tab, to bring one to the front and read their story.">
        <div class="row" id="row"><span class="marker" id="marker" aria-hidden="true"></span></div>
        <aside class="story" id="story" aria-live="polite"><div class="inner" id="storyInner"></div></aside>
      </div>
      <p class="hint" id="hint">Move your pointer across the group. Tab works too.</p>
      <div class="roles" id="roles" aria-label="Choose a colleague by role"></div>
    </div>
    <script type="module" src="../scripts/prototypes/people.js"></script>
  </body>
</html>
