<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Our People | prototype</title>
    <meta name="description" content="Prototype for the People section: a group of colleagues where the one you look at comes forward with their story of impact." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="../brand/equinix-fortress.svg" />
<link rel="stylesheet" href="../styles/tokens.css" />
<link rel="stylesheet" href="../styles/people.css" />
<style>
  /* Page shell for the prototype; the line itself is styled by people.css, shared with the site. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f6f5f2; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
  :root { --bg: #f6f5f2; }
  .wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 36px 0 72px; display: grid; gap: 22px; }
  header { display: grid; grid-template-columns: 1.1fr 1fr; align-items: end; gap: 16px 40px; width: min(1320px, calc(100% - 2 * var(--gutter))); margin: 0 auto; }
  @media (max-width: 900px) { header { grid-template-columns: 1fr; } }
  .brand img { display: block; height: 14px; width: auto; }
  .eyebrow { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); font-weight: 600; margin: 14px 0 6px; }
  h1 { font-weight: 700; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02; letter-spacing: -0.02em; margin: 0; max-width: 16ch; }
  .lede { color: var(--ink-2); max-width: 58ch; margin: 0; font-size: 17px; }
  .fabric-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1s ease; }
  .fabric-layer canvas { display: block; width: 100%; height: 100%; }
  :root[data-fabric='on'] .fabric-layer.is-ready { opacity: 0.9; }
  .switch { display: flex; gap: 6px; margin: 0 0 10px; }
  .switch button { font: 600 12px var(--font); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .people-stage { margin-top: 0; }
  :root[data-backdrop='corridor'] .people-stage { background: #fff; border-radius: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.08); padding-top: 48px; overflow: hidden; }
  :root[data-backdrop='corridor'] .people-stage::before { content: ""; position: absolute; inset: 0; background: url(../media/clip-people-poster.jpg) center 40% / cover no-repeat; filter: blur(14px) saturate(.55) brightness(1.08); opacity: .42; transform: scale(1.08); z-index: 0; }
  :root[data-backdrop='corridor'] .people-stage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,.1) 45%, #fff 92%); z-index: 1; pointer-events: none; }
  :root[data-backdrop='plain'] .people-stage { background: #fff; border-radius: 24px; padding-top: 48px; }
</style>
  </head>
  <body>
    <div class="fabric-layer" id="fabric-layer" aria-hidden="true"></div>
    <div class="wrap">
      <header>
        <div>
          <div class="brand"><img src="../brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" /></div>
          <div class="eyebrow">The people behind the connections</div>
          <h1>Our people are part of the story.</h1>
        </div>
        <div class="switch" role="group" aria-label="Backdrop"><button type="button" data-bg="fabric" aria-pressed="true">Red fabric</button><button type="button" data-bg="corridor" aria-pressed="false">Corridor</button><button type="button" data-bg="plain" aria-pressed="false">Plain</button></div>
      </header>

      <div class="people-stage" id="stage" aria-label="Six colleagues in a line. Move across them, or use Tab, to bring one to the front and read their story.">
        <div class="people-row"></div>
      </div>
      <div class="people-story" aria-live="polite"></div>
      <p class="people-hint">Move your pointer across the group, or wait and they will take turns.</p>
      <div class="people-roles" aria-label="Choose a colleague by role"></div>
    </div>
    <script type="module" src="../scripts/prototypes/people.js"></script>
  </body>
</html>
