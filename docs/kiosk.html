<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiosk | Equinix connected impact</title>
    <meta name="description" content="The community model alone, full screen, telling its six stories on a loop." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="brand/equinix-fortress.svg" />
    <script>
      // The kiosk moves unless the address says otherwise (?motion=off); nobody's system setting reaches it
      (function () {
        var q = new URLSearchParams(location.search);
        document.documentElement.dataset.motion = q.get('motion') === 'off' ? 'off' : 'on';
      })();
    </script>
    <script type="module" crossorigin src="./assets/kiosk-BPYN64KW.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="./assets/stories-PkbF1guy.js">
    <link rel="modulepreload" crossorigin href="./assets/three.module-DdypQxiE.js">
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-Bt_IIeJG.js">
    <link rel="stylesheet" crossorigin href="./assets/kiosk-DP5Lz8AS.css">
    <link rel="stylesheet" crossorigin href="./assets/main-CV2flPi1.css">
  </head>
  <body class="page-kiosk">
    <div class="kiosk" id="kiosk" data-mode="loading">
      <div class="explorer" id="explorer" tabindex="0" aria-label="Community model. Touch to turn it, choose a place to step inside.">
        <div class="stage" id="stage" data-scene-state="loading">
          <img class="stage-still" src="media/city/city-hero-1600.webp" srcset="media/city/city-hero-1000.webp 1000w, media/city/city-hero-1600.webp 1600w" sizes="100vw" alt="" width="1600" height="1000" decoding="async" />
          <div class="scene-host" id="scene-host"></div>
          <div class="scene-labels" id="scene-labels" aria-label="Places in the community">
            <button type="button" class="place-label" data-place="hospital"><i class="place-dot" aria-hidden="true"></i><span>Hospital</span></button>
            <button type="button" class="place-label" data-place="research"><i class="place-dot" aria-hidden="true"></i><span>Research centre</span></button>
            <button type="button" class="place-label" data-place="learning"><i class="place-dot" aria-hidden="true"></i><span>Learning centre</span></button>
            <button type="button" class="place-label" data-place="homes"><i class="place-dot" aria-hidden="true"></i><span>Homes and high street</span></button>
            <button type="button" class="place-label" data-place="aquatic"><i class="place-dot place-dot--heat" aria-hidden="true"></i><span>Aquatic centre</span></button>
            <button type="button" class="place-label place-label--dc" data-place="datacenter"><i class="place-dot" aria-hidden="true"></i><span>Equinix data center</span></button>
          </div>
        </div>
      </div>

      <header class="kiosk-strip">
        <img class="kiosk-logo" src="brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" />
        <div class="kiosk-words">
          <p class="eyebrow">The community</p>
          <p class="kiosk-title">Dive into the stories.</p>
        </div>
      </header>

      <footer class="kiosk-foot">
        <ol class="kiosk-dots" aria-label="The six stories"></ol>
        <p class="kiosk-note note" data-kiosk-note>Each story refers to its named location.</p>
        <div class="kiosk-controls">
          <button type="button" class="kiosk-chip" data-sound hidden>Tap for sound</button>
          <button type="button" class="bar-btn" data-mute aria-pressed="false" aria-label="Mute the sound"><svg class="icon-sound" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5h2.5L8 2v10L4.5 9H2z" fill="currentColor"/><path d="M10 4.5a3.2 3.2 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        </div>
      </footer>

      <p class="kiosk-fallback" hidden>This screen needs WebGL to show the model. The still above is the community at rest.</p>
    </div>

    <section class="room" id="room" hidden data-phase="closed" aria-label="Inside the building" role="dialog" aria-modal="true">
      <div class="room-stage" tabindex="0" aria-label="The room. Drag or use the arrow keys to look around.">
        <video class="room-film" muted playsinline preload="auto" aria-hidden="true"></video>
        <div class="room-pano"></div>
        <img class="room-poster" src="" alt="" decoding="async" />
        <div class="room-veil" aria-hidden="true"></div>
      </div>
      <div class="room-top">
        <h2 class="room-title">Inside</h2>
        <button type="button" class="room-btn room-btn--voice" data-room-voice aria-pressed="true">Voice on</button>
        <button type="button" class="room-btn room-btn--tour" data-room-pause aria-pressed="false">Pause</button>
        <button type="button" class="room-btn room-btn--tour" data-room-skip>Skip</button>
        <button type="button" class="room-btn" data-room-next>Next</button>
        <button type="button" class="room-btn room-btn--leave" data-room-leave>Leave</button>
      </div>
      <div class="room-captions" aria-live="polite"></div>
      <audio class="room-voice" preload="none" aria-hidden="true"></audio>
      <p class="room-hint note" hidden>Drag to look around</p>
    </section>

    <audio id="theme" loop preload="none" aria-hidden="true"><source src="media/audio/community-theme.mp3" type="audio/mpeg"><source src="media/audio/community-theme.ogg" type="audio/ogg" /></audio>

  </body>
</html>
