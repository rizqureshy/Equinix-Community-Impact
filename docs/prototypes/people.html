<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Our People | prototype</title>
    <meta name="description" content="Prototype for the People section: a group of colleagues where the one you look at comes forward with their story of impact." />

<style>:root{--bg:#f6f5f2;--panel:#fff;--fg:#1d1d1f;--muted:#6b6861;--line:#e4e1da;--accent:#e91c24;--display:"Fraunces Variable", Georgia, serif;--body:"Inter Tight Variable", -apple-system, "Helvetica Neue", Arial, sans-serif}*{box-sizing:border-box}html,body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;font-size:15px;line-height:1.5}.wrap{max-width:1240px;padding:36px max(16px, env(safe-area-inset-left,0px)) 72px;gap:22px;margin:0 auto;display:grid}header{flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;display:flex}.brand img{width:auto;height:14px;display:block}.eyebrow{letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:14px 0 6px;font-size:11px;font-weight:600}h1{letter-spacing:-.02em;max-width:16ch;margin:0;font-size:clamp(30px,4.4vw,52px);font-weight:700;line-height:1.02}.lede{color:var(--muted);max-width:58ch;margin:0;font-size:17px}.stage{background:#fff;border-radius:24px;padding:36px 0 0;position:relative;overflow:hidden;box-shadow:0 30px 80px #00000014}.row{justify-content:center;align-items:flex-end;padding:0 3%;display:flex;position:relative}.person{cursor:pointer;transform-origin:50% 85%;background:0 0;border:0;flex:none;width:21%;margin:0 -2.6%;padding:0;transition:transform .5s cubic-bezier(.2,.7,.2,1);position:relative}.person img{filter:drop-shadow(0 14px 26px #0000001f);width:100%;height:auto;display:block;-webkit-mask-image:linear-gradient(#000 66%,#000000b3 82%,#0000 98%);mask-image:linear-gradient(#000 66%,#000000b3 82%,#0000 98%)}.person.on{transform:translateY(-4%)scale(1.12)}.person:focus-visible{outline:none}.person:focus-visible img{outline:3px solid var(--accent);outline-offset:-3px;border-radius:16px}.marker{background:var(--accent);opacity:0;border-radius:2px;width:56px;height:3px;transition:left .5s cubic-bezier(.2,.7,.2,1),opacity .3s;position:absolute;bottom:0;left:0;transform:translate(-50%)}.story{border-top:1px solid var(--line);min-height:190px;padding:22px 32px 26px;display:grid}.story .inner{grid-template-columns:1fr 1.6fr;align-items:start;gap:8px 40px;transition:opacity .25s,transform .25s;display:grid}.story.swap .inner{opacity:0;transform:translateY(6px)}.story .where{letter-spacing:.08em;text-transform:uppercase;color:var(--muted);grid-column:1/-1;font-size:12px}.story .head{font-family:var(--display);letter-spacing:-.01em;font-size:clamp(24px,2.6vw,34px);font-weight:500;line-height:1.08}.story .fig{font-family:var(--display);letter-spacing:-.02em;margin-top:8px;font-size:48px;font-weight:300;line-height:1}.story .fig small{font-family:var(--body);color:var(--muted);letter-spacing:0;margin-top:4px;font-size:13px;display:block}.story .line{color:var(--fg);grid-area:2/2/span 2;font-size:15px;line-height:1.55}.story .src{color:var(--muted);grid-column:1/-1;font-size:11.5px}.hint{color:var(--muted);font-size:13px}.roles{grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:8px;display:grid}.roles button{text-align:left;border:0;border-top:1px solid var(--line);cursor:pointer;font:inherit;color:var(--fg);background:0 0;gap:2px;min-width:0;padding:12px 0 0;display:grid}.roles button b{font-size:14px;font-weight:600}.roles button span{color:var(--muted);font-size:12.5px}.roles button[aria-pressed=true] b{color:var(--accent)}@media (width<=760px){.stage{border-radius:18px;padding-top:18px}.row{scroll-snap-type:x mandatory;scrollbar-width:none;justify-content:flex-start;padding:0 20vw;overflow-x:auto}.row::-webkit-scrollbar{display:none}.person{scroll-snap-align:center;flex:0 0 58vw;width:auto;margin:0 -7vw}.person.on{transform:translateY(-3%)scale(1.06)}.story{padding:16px 18px 20px}.story .inner{grid-template-columns:1fr;gap:6px}.story .line{grid-area:auto/1;font-size:14px}.story .fig{font-size:36px}.roles{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (prefers-reduced-motion:reduce){.person,.story,.story .inner{transition:none}}</style>
    <script type="module" crossorigin src="../assets/people-CsYB9AgK.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="stylesheet" crossorigin href="../assets/fraunces-CmrgHZs2.css">
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <div class="brand"><img src="../brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" /></div>
          <div class="eyebrow">The people behind the connections</div>
          <h1>Our people are part of the story.</h1>
        </div>
        <p class="lede">Six colleagues, one line. Move across them and the one you look at comes to the front with the story of what their work does for the community. Click to keep them there.</p>
      </header>

      <div class="stage" id="stage" aria-label="Six colleagues in a line. Move across them, or use Tab, to bring one to the front and read their story.">
        <div class="row" id="row"><span class="marker" id="marker" aria-hidden="true"></span></div>
        <aside class="story" id="story" aria-live="polite"><div class="inner" id="storyInner"></div></aside>
      </div>
      <p class="hint" id="hint">Move your pointer across the group. Tab works too.</p>
      <div class="roles" id="roles" aria-label="Choose a colleague by role"></div>
    </div>
  </body>
</html>
