<style>:root{--bg:#f6f5f2;--panel:#fff;--fg:#1d1d1f;--muted:#6b6861;--line:#e4e1da;--accent:#e91c24;--display:"Fraunces Variable", Georgia, serif;--body:"Inter Tight Variable", -apple-system, "Helvetica Neue", Arial, sans-serif}*{box-sizing:border-box}html,body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;font-size:15px;line-height:1.5}.wrap{max-width:1240px;padding:36px max(16px, env(safe-area-inset-left,0px)) 72px;gap:22px;margin:0 auto;display:grid}header{flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;display:flex}.brand img{width:auto;height:14px;display:block}.eyebrow{letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:14px 0 6px;font-size:11px;font-weight:600}h1{letter-spacing:-.02em;max-width:16ch;margin:0;font-size:clamp(30px,4.4vw,52px);font-weight:700;line-height:1.02}.lede{color:var(--muted);max-width:58ch;margin:0;font-size:17px}.stage{aspect-ratio:16/10;cursor:crosshair;background:#fff;border-radius:24px;max-width:100%;position:relative;overflow:hidden;box-shadow:0 30px 80px #00000014}.stage:after{content:"";pointer-events:none;z-index:40;background:linear-gradient(#fff0,#fff);height:14%;position:absolute;bottom:0;left:0;right:0}.person{cursor:pointer;transform-origin:50% 30%;will-change:transform, filter;background:0 0;border:0;padding:0;transition:filter .5s,opacity .5s;position:absolute}.person img{filter:drop-shadow(0 18px 30px #0000001a);width:100%;height:auto;display:block;-webkit-mask-image:linear-gradient(#000 62%,#0009 80%,#0000 97%);mask-image:linear-gradient(#000 62%,#0009 80%,#0000 97%)}.person:focus-visible{outline:none}.person:focus-visible img{outline:3px solid var(--accent);outline-offset:-3px;border-radius:16px}.person .name{letter-spacing:.08em;text-transform:uppercase;color:#fff;white-space:nowrap;opacity:0;background:#1d1d1fbf;border-radius:999px;padding:4px 9px;font-size:11px;transition:opacity .35s;position:absolute;bottom:14%;left:50%;transform:translate(-50%)}.person.on .name{opacity:1}.story{z-index:50;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);pointer-events:none;opacity:0;background:#ffffffdb;border-radius:18px;gap:6px;width:min(380px,42%);padding:18px 20px 16px;transition:opacity .4s,transform .5s cubic-bezier(.2,.7,.2,1),left .6s cubic-bezier(.2,.7,.2,1),right .6s cubic-bezier(.2,.7,.2,1);display:grid;position:absolute;bottom:6%;transform:translateY(10px)}.story.show{opacity:1;transform:none}.story .role{font-family:var(--display);letter-spacing:-.01em;font-size:24px;font-weight:500;line-height:1.1}.story .where{letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:12px}.story .fig{font-family:var(--display);letter-spacing:-.02em;margin-top:4px;font-size:40px;font-weight:300;line-height:1}.story .fig small{font-family:var(--body);color:var(--muted);letter-spacing:0;margin-top:3px;font-size:13px;display:block}.story .line{color:var(--muted);font-size:14px;line-height:1.45}.story .src{color:var(--muted);font-size:11.5px}.story .pin{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:11px}.story .inner{gap:6px;transition:opacity .25s,transform .25s;display:grid}.story.swap .inner{opacity:0;transform:translateY(6px)}.hint{color:var(--muted);font-size:13px}.roles{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:8px;display:grid}.roles button{text-align:left;border:0;border-top:1px solid var(--line);cursor:pointer;font:inherit;color:var(--fg);background:0 0;gap:2px;min-width:0;padding:12px 0 0;display:grid}.roles button b{font-size:14px;font-weight:600}.roles button span{color:var(--muted);font-size:12.5px}.roles button[aria-pressed=true] b{color:var(--accent)}@media (width<=760px){.stage{aspect-ratio:auto;cursor:default;border-radius:18px;height:78svh}.row{scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;gap:0;padding:4% 20vw 0;display:flex;position:absolute;inset:0;overflow-x:auto}.row::   <body>
    <div class="wrap">
      <header>
        <div>
          <div class="brand"><img src="../brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" /></div>
          <div class="eyebrow">The people behind the connections</div>
          <h1>Our people are part of the story.</h1>
        </div>
        <p class="lede">Ten colleagues, one group. Move across them and the one you look at comes forward with what they did for the community last year. Click to keep them there.</p>
      </header>

      <div class="stage" id="stage" aria-label="A group of ten colleagues. Move across them, or use Tab, to bring one forward and read their story.">
        <div class="row" id="row"></div>
        <aside class="story" id="story" aria-live="polite"><div class="inner" id="storyInner"></div></aside>
      </div>
      <p class="hint" id="hint">Move your pointer across the group. Tab works too.</p>
      <div class="roles" id="roles" aria-label="Choose a colleague by role"></div>
    </div>
