<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Our People | prototype</title>
    <meta name="description" content="Prototype for the People section: a group of colleagues where the one you look at comes forward with their story of impact." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="../brand/equinix-fortress.svg" />
<style>*{box-sizing:border-box}html,body{color:var(--ink);font-family:var(--font);background:#f6f5f2;margin:0;font-size:15px;line-height:1.5}:root{--bg:#f6f5f2}.wrap{z-index:1;gap:22px;max-width:1320px;margin:0 auto;padding:36px 0 72px;display:grid;position:relative}header{width:min(1320px, calc(100% - 2 * var(--gutter)));grid-template-columns:1.1fr 1fr;align-items:end;gap:16px 40px;margin:0 auto;display:grid}@media (width<=900px){header{grid-template-columns:1fr}}.brand img{width:auto;height:14px;display:block}.eyebrow{letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin:14px 0 6px;font-size:11px;font-weight:600}h1{letter-spacing:-.02em;max-width:16ch;margin:0;font-size:clamp(30px,4.4vw,52px);font-weight:700;line-height:1.02}.lede{color:var(--ink-2);max-width:58ch;margin:0;font-size:17px}.fabric-layer{z-index:0;pointer-events:none;opacity:0;transition:opacity 1s;position:fixed;inset:0}.fabric-layer canvas{width:100%;height:100%;display:block}:root[data-fabric=on] .fabric-layer.is-ready{opacity:.9}.switch{gap:6px;margin:0 0 10px;display:flex}.switch button{font:600 12px var(--font);color:var(--ink);border:1px solid var(--line);cursor:pointer;background:#fff;border-radius:999px;padding:6px 12px}.switch button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.people-stage{margin-top:0}:root[data-backdrop=corridor] .people-stage{background:#fff;border-radius:24px;padding-top:48px;overflow:hidden;box-shadow:0 30px 80px #00000014}:root[data-backdrop=corridor] .people-stage:before{content:"";filter:blur(14px)saturate(.55)brightness(1.08);opacity:.42;z-index:0;background:url(../media/clip-people-poster.jpg) 50% 40%/cover no-repeat;position:absolute;inset:0;transform:scale(1.08)}:root[data-backdrop=corridor] .people-stage:after{content:"";z-index:1;pointer-events:none;background:linear-gradient(#ffffff8c,#ffffff1a 45%,#fff 92%);position:absolute;inset:0}:root[data-backdrop=plain] .people-stage{background:#fff;border-radius:24px;padding-top:48px}</style>
    <script type="module" crossorigin src="../assets/people-BJTfKbW_.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/three.module-BTHD0e78.js">
    <link rel="modulepreload" crossorigin href="../assets/RoomEnvironment-FVeyuGSK.js">
    <link rel="modulepreload" crossorigin href="../assets/fabric-CRYvQHwV.js">
    <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="../assets/people-line-B4R3lkNW.js">
    <link rel="stylesheet" crossorigin href="../assets/people-line-DSnAaPJU.css">
    <link rel="stylesheet" crossorigin href="../assets/people-Cph8gKjT.css">
    <link rel="stylesheet" crossorigin href="../assets/inter-tight-CK7fX4GS.css">
  </head>
  <body>
    <div class="fabric-layer" id="fabric-layer" aria-hidden="true"></div>
    <div class="wrap">
      <header>
        <div>
          <div class="brand"><img src="../brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" /></div>
          <div class="eyebrow">The people behind the connections</div>
          <h1>Our people are part of the story.</h1>
        </div>
        <div class="switch" role="group" aria-label="Backdrop"><button type="button" data-bg="fabric" aria-pressed="true">Red fabric</button><button type="button" data-bg="corridor" aria-pressed="false">Corridor</button><button type="button" data-bg="plain" aria-pressed="false">Plain</button></div>
      </header>

      <div class="people-stage" id="stage" aria-label="Six colleagues in a line. Move across them, or use Tab, to bring one to the front and read their story.">
        <div class="people-row"></div>
      </div>
      <div class="people-story" aria-live="polite"></div>
      <p class="people-hint">Move your pointer across the group, or wait and they will take turns.</p>
      <div class="people-roles" aria-label="Choose a colleague by role"></div>
    </div>
  </body>
</html>
