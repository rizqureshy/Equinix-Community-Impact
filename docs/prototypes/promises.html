  <body>
    <div class="wrap">
      <header class="top">
        <div>
          <div class="brand"><img src="../brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" /></div>
          <div class="eyebrow">Part of the community</div>
          <h1>Five promises to the places we call home.</h1>
        </div>
        <div class="switches" aria-label="Prototype treatments">
          <div class="switch" role="group" aria-label="Ink"><span>Ink</span><button type="button" data-ink="line" aria-pressed="true">Hairline</button><button type="button" data-ink="tint" aria-pressed="false">Hairline and wash</button></div>
          <div class="switch" role="group" aria-label="Drawing"><span>Drawing</span><button type="button" data-route="ref" aria-pressed="true">Traced from the photograph</button><button type="button" data-route="svg" aria-pressed="false">Sketched by the model</button></div>
          <p class="lede">Each promise is drawn as a plan: one red line, drawn as you scroll. Move your hand over the plan and the promise kept develops through it.</p>
        </div>
      </header>

      <section class="promises" aria-label="The five promises">
        <ol class="list" id="list"><div class="thread" aria-hidden="true"><i id="thread-fill"></i></div></ol>
        <div class="stage-col">
          <div class="sheet">
            <div class="plan" id="plan">
              <span class="tick tl" aria-hidden="true"></span><span class="tick tr" aria-hidden="true"></span><span class="tick bl" aria-hidden="true"></span><span class="tick br" aria-hidden="true"></span>
              <div class="layer drawing" id="drawing" aria-hidden="true"></div>
              <div class="layer photo" id="photo"><canvas id="photo-canvas"></canvas></div>
              <p class="hint" id="hint">Move your hand over the plan</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
