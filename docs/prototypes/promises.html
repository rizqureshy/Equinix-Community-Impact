:color .3s}.row.on .num{color:var(--red)}.name{letter-spacing:-.025em;color:var(--ink-3);margin:0;font-size:clamp(24px,2.6vw,34px);font-weight:700;line-height:1.08;transition:color .4s}.row.on .name{color:var(--ink)}.promise{color:var(--ink-2);opacity:.55;max-width:42ch;margin:0;font-size:17px;transition:opacity .4s}.row.on .promise{opacity:1}.kept{border-top:1px dashed var(--line-strong);color:var(--ink);opacity:0;max-width:42ch;margin:8px 0 0;padding-top:10px;font-size:14px;transition:opacity .6s,transform .6s;transform:translateY(6px)}.row.is-kept .kept{opacity:1;transform:none}.kept b{letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:3px;font-size:11px;display:block}.kept a{color:var(--ink-3);text-underline-offset:3px;text-decoration:underline}.listen{font:600 12px var(--font);color:var(--ink);border:1px solid var(--line-strong);cursor:pointer;opacity:0;background:#fff;border-radius:999px;align-items:center;gap:7px;margin-top:6px;padding:6px 12px 6px 10px;transition:opacity .4s,border-color .2s;display:inline-flex}.row.on .listen{opacity:1}.listen:hover{border-color:var(--ink)}.listen[aria-pressed=true]{color:#fff;background:var(--red);border-color:var(--red)}.stage-col{position:relative}.sheet{place-items:center;height:86vh;display:grid;position:sticky;top:7vh}.plan{aspect-ratio:2/3;max-width:100%;height:min(86vh,100%);box-shadow:0 1px 0 var(--line), 0 24px 70px #00000012;background:#fff;border-radius:6px;position:relative;overflow:hidden}.plan:before{content:"";z-index:0;pointer-events:none;background-image:linear-gradient(90deg,#00000009 1px,#0000 1px),linear-gradient(#00000009 1px,#0000 1px);background-size:12.5% 8.333%;transition:opacity 1.6s;position:absolute;inset:0}.plan[data-phase=developing]:before,.plan[data-phase=kept]:before{opacity:0}.plan .tick{z-index:5;pointer-events:none;width:14px;height:14px;position:absolute}.plan .tick:before,.plan .tick:after{content:"";background:var(--ink-3);opacity:.6;position:absolute}.plan .tick:before{width:1px;height:14px;top:0;left:7px}.plan .tick:after{width:14px;height:1px;top:7px;left:0}.plan .tick.tl{top:14px;left:14px}.plan .tick.tr{top:14px;right:14px}.plan .tick.bl{bottom:14px;left:14px}.plan .tick.br{bottom:14px;right:14px}.layer{position:absolute;inset:0}.wash{z-index:1;opacity:0;place-items:center;padding:5%;transition:opacity .2s linear;display:grid}.wash img{object-fit:contain;width:100%;height:100%;display:block}.plan[data-phase=developing] .wash,.plan[data-phase=kept] .wash{transition:opacity 1.2s;opacity:0!important}.photo{z-index:2}.photo img{object-fit:cover;opacity:0;filter:blur(18px)saturate(.3)brightness(1.08)sepia(.4);width:100%;height:100%;transition:opacity 1.6s,filter 1.7s;position:absolute;inset:0}.plan[data-phase=developing] .photo img,.plan[data-phase=kept] .photo img{opacity:1;filter:none}.drawing{z-index:3;pointer-events:none;place-items:center;padding:5%;transition:opacity 1.6s .4s;display:grid}.drawing svg{width:100%;height:100%;display:block}.drawing svg path,.drawing svg line,.drawing svg polyline,.drawing svg polygon,.drawing svg circle,.drawing svg ellipse{vector-effect:non-scaling-stroke}.plan[data-phase=developing] .drawing,.plan[data-phase=kept] .drawing{opacity:.32}.pending{color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;place-items:center;font-size:13px;display:grid}.pending b{font:600 clamp(80px, 12vw, 140px)/1 var(--font);letter-spacing:-.04em;color:var(--red);opacity:.12;display:block}@media (width<=900px){.promises{grid-template-columns:1fr}.stage-col{order:-1}.sheet{z-index:2;background:linear-gradient(#fff 80%,#fff0);height:62vh;position:sticky;top:0}.plan{height:58vh}.row{min-height:0;padding:36px 0}}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.photo img,.drawing,.wash,.plan:before{transition-duration:.3s;transition-delay:0s}}</style>

    <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-P2Xu9kJm.js">

  <body>
    <div class="wrap">
      <header class="top">
        <div>
          <div class="brand"><img src="../brand/equinix-logo-horizontal.svg" alt="Equinix" width="124" height="13" decoding="async" /></div>
          <div class="eyebrow">Part of the community</div>
          <h1>Five promises to the places we call home.</h1>
        </div>
        <div>
          <p class="lede">Each promise is drawn as a plan, in one red line. Then the promise kept develops through it. Listen to one, or let the narrator read all five.</p>
          <button type="button" class="btn" id="play-all" aria-pressed="false"><svg class="play" width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><path d="M1 1.5v9l8-4.5z" fill="currentColor"/></svg><svg class="stop" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1" fill="currentColor"/></svg><span>Play the five promises</span></button>
        </div>
      </header>

      <section class="promises" aria-label="The five promises">
        <ol class="list" id="list"><div class="thread" aria-hidden="true"><i id="thread-fill"></i></div></ol>
        <div class="stage-col">
          <div class="sheet">
            <div class="plan" id="plan" data-phase="paper" aria-hidden="true">
              <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
              <div class="layer wash" id="wash"></div>
              <div class="layer photo"><img id="photo-img" alt="" decoding="async" /></div>
              <div class="layer drawing" id="drawing"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
